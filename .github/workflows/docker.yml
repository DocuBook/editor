# Builds the web Docker image: amd64 validation on PRs, native multi-arch publish on tags.
# Users never build: `docker pull ghcr.io/docubook/editor` and run.
name: Docker Web Image

on:
  push:
    tags:
      - 'v*'
    # release-please tags the release commit via the API *after* it lands on
    # master, so the tag push event never fires for a release — the run we get
    # is the master push, and no `startsWith(github.ref, 'refs/tags/v')` test
    # can match it. Watch master too and let the resolve-tag job decide whether
    # the pushed commit actually carries a release tag.
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/docubook/editor
  NODE_VERSION: "22.12.0"

permissions:
  contents: read

jobs:
  # A tag push names the tag in github.ref. release-please instead creates the
  # tag on an already-pushed master commit, so no tag-ref run exists and every
  # `startsWith(github.ref, 'refs/tags/v')` test below was false — which is how
  # v0.2.0 shipped no image to GHCR. Resolve "is this a release tag?" once here
  # and gate the publish steps on the output instead of on github.ref.
  resolve-tag:
    runs-on: ubuntu-24.04
    # Runs on PRs too (with an empty tag) purely so `build-and-push`, which
    # needs it, is not skipped — a skipped dependency would skip the PR check.
    # The resolver itself is only reached when a release is possible: a PR can
    # never be one, and the lookup would be wasted API calls.
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # MUST come before the resolver: this step runs a repo script
      # (./.github/scripts/resolve-release-tag.sh) relative to the workspace, and
      # GitHub does NOT check the repo out for you. Without it the step died with
      # exit 127 ("No such file or directory"), which failed resolve-tag and
      # skipped build-and-push/merge on every master push and tag push — the
      # image was never built. It went unnoticed while only PRs ran this workflow
      # routinely; the check below is cheap and the tag lookup is gated on it.
      - uses: actions/checkout@v7
      - name: Resolve the release tag
        id: resolve
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/resolve-release-tag.sh >> "$GITHUB_OUTPUT"
      # package.json is read by this step, so it relies on the checkout above
      # being unconditional — it no longer fetches the repo itself.
      - name: Validate release tag
        if: steps.resolve.outputs.tag != ''
        shell: bash
        run: |
          version=$(jq -r '.version' package.json)
          expected_tag="v$version"
          [ "${{ steps.resolve.outputs.tag }}" = "$expected_tag" ] || {
            echo "::error::Release tag ${{ steps.resolve.outputs.tag }} does not match manifest version $expected_tag"
            exit 1
          }
          echo "OK: tag $expected_tag matches package.json"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend once
        run: npm run build
      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: docker-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    permissions:
      contents: read
      packages: write
    needs: [frontend, resolve-tag]
    # PRs validate amd64 only. Releases and manual runs use native amd64 + arm64.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-approval' || 'release-auto' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a release, build the exact tagged tree rather than the branch.
          ref: ${{ needs.resolve-tag.outputs.tag || github.sha }}
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          # The frontend artifact is keyed by the run's SHA; keep it that way so
          # this lookup still works when the checkout ref is a tag.
          name: docker-web-${{ github.sha }}
          path: .docker-web
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: needs.resolve-tag.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        if: needs.resolve-tag.outputs.tag != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # metadata-action derives ref-based tags from github.ref, which on the
          # release-please master push is refs/heads/master. Feed it the resolved
          # tag via `value` so the image gets :vX.Y.Z and :X.Y.Z (+ latest).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve-tag.outputs.tag, '-') }}
      - name: Build PR check
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: web-content=.docker-web
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:check-${{ matrix.slug }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
      - name: Build manual check
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: web-content=.docker-web
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:check-${{ matrix.slug }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
      - name: Smoke test image
        if: github.event_name != 'push' || needs.resolve-tag.outputs.tag == ''
        run: sudo sh .github/scripts/smoke-test.sh "${{ env.IMAGE }}:check-${{ matrix.slug }}" "${{ matrix.platform }}"

      - name: Build and push platform image
        id: build
        if: needs.resolve-tag.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: web-content=.docker-web
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }},mode=max
      - name: Smoke test published image
        if: needs.resolve-tag.outputs.tag != ''
        run: sudo sh .github/scripts/smoke-test.sh "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" "${{ matrix.platform }}"
      - name: Export digest
        if: needs.resolve-tag.outputs.tag != ''
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.resolve-tag.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      packages: write
    if: needs.resolve-tag.outputs.tag != ''
    needs: [build-and-push, resolve-tag]
    runs-on: ubuntu-24.04
    environment: release-auto
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Same as the platform job: derive tags from the resolved tag, not
          # from github.ref (which is a branch on the release-please push).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve-tag.outputs.tag, '-') }}
      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
