name: CI

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLORS: always
  NODE_VERSION: "22.23.4"

permissions:
  contents: read

# A new push to a PR supersedes its running check (the macOS jobs alone take
# 15-40 min). Master and tag pushes each get their own group so a later merge
# never cancels — or, through GitHub's one-pending-run-per-group rule, drops —
# the run that publishes a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The release config guard resolves bootstrap-sha against history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Oxlint
        run: npx oxlint frontend/ test/__fixtures__/
      - name: TypeScript type check
        run: npx tsc -b
      - name: ACL guard (every Tauri command has an allow entry)
        run: node test/check-acl.mjs
      - name: Docker path guard (shared core crate is packaged)
        run: node test/check-docker-paths.mjs
      - name: Release config guard (release-please config is not stale)
        run: node test/check-release-config.mjs
      - name: Changelog heading guard (release PR heading normaliser works)
        run: node test/check-changelog-heading.mjs
      - name: Release tag guard (release detection does not depend on github.ref)
        run: node test/check-release-tag.mjs
      - name: Release notes guard (body is the tag's changelog, no icons, contributors)
        run: node test/check-release-notes.mjs
      - name: Frontend tests
        run: npm test
      # Engine-compat guard on what ships: the source lint above (compat/compat)
      # cannot see dependencies or Tailwind output. Targets: .browserslistrc.
      - name: Build frontend (for the bundle compat guard)
        run: npx vite build
      - name: Bundle compat guard (WKWebView Safari 15.4 / Chrome 105)
        run: npm run lint:compat
      - name: Check version consistency (manifests + locks + changelog section)
        run: |
          npm_v=$(node -p "require('./package.json').version")
          lock_v=$(node -p "require('./package-lock.json').version")
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | awk '{print $3}' | tr -d '"')
          server_v=$(grep -m1 '^version' server/Cargo.toml | awk '{print $3}' | tr -d '"')
          core_v=$(grep -m1 '^version' core/Cargo.toml | awk '{print $3}' | tr -d '"')
          # Read tauri.conf.json through JSON, not grep: the key is indented, so a
          # `grep -A2 '^version'` never matched and silently produced an empty
          # string — which made the comparison below vacuously true and skipped
          # the file entirely.
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          desktop_lock_v=$(grep -A1 'name = "docubook-desktop"' src-tauri/Cargo.lock | grep -m1 '^version' | awk '{print $3}' | tr -d '"')
          server_lock_v=$(grep -A1 'name = "docubook-server"' server/Cargo.lock | grep -m1 '^version' | awk '{print $3}' | tr -d '"')
          core_lock_v=$(grep -A1 'name = "docubook-core"' core/Cargo.lock | grep -m1 '^version' | awk '{print $3}' | tr -d '"')
          # `core` is a path dependency of both consumers, so it also appears as a
          # nested [[package]] entry in their locks. Those drifts are invisible to
          # the root-only checks above (and did pass this gate while
          # `cargo check --locked` failed in v0.2.0's PR 276), so they are
          # extracted and compared here as well.
          desktop_core_lock_v=$(grep -A1 'name = "docubook-core"' src-tauri/Cargo.lock | grep -m1 '^version' | awk '{print $3}' | tr -d '"')
          server_core_lock_v=$(grep -A1 'name = "docubook-core"' server/Cargo.lock | grep -m1 '^version' | awk '{print $3}' | tr -d '"')
          echo "package.json=$npm_v package-lock=$lock_v Cargo.toml=$cargo_v server=$server_v core=$core_v tauri.conf.json=$tauri_v Cargo.lock(desktop)=$desktop_lock_v Cargo.lock(server)=$server_lock_v Cargo.lock(core)=$core_lock_v Cargo.lock(desktop core dep)=$desktop_core_lock_v Cargo.lock(server core dep)=$server_core_lock_v"
          for v in "$lock_v" "$cargo_v" "$server_v" "$core_v" "$tauri_v" "$desktop_lock_v" "$server_lock_v" "$core_lock_v" "$desktop_core_lock_v" "$server_core_lock_v"; do
            [ -n "$v" ] || { echo "::error::Could not extract a version — a manifest may have moved or changed format"; exit 1; }
            [ "$npm_v" = "$v" ] || { echo "::error::Version mismatch — bump manifests together (pre-push hook syncs *.lock)"; exit 1; }
          done
          # Accept both changelog heading dialects: this repo's own
          # ("## v0.1.8 — 2026-10-03") and the release-please generated ones
          # ("## 0.2.0 (…)" / "## [0.2.0](…) (…)"). The release PR is normalised
          # to the first form by release-please.yml before it reaches this gate;
          # accepting the others too keeps the gate usable on an un-normalised
          # branch and across the dialect release-please happens to pick.
          # test/check-changelog-heading.mjs guards this pattern and that rewrite.
          grep -qE "^## v$npm_v( —| \()" CHANGELOG.md || { echo "::error::CHANGELOG.md missing section '## v$npm_v' (expected '## v$npm_v — ' or '## v$npm_v (')"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v$npm_v"
            [ "$GITHUB_REF_NAME" = "$expected_tag" ] || {
              echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $expected_tag"
              exit 1
            }
          fi

  test:
    runs-on: macos-15
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo (registry + targets)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            src-tauri/target
            server/target
          key: cargo-macos15-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos15-test-
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Shared engine test (core)
        run: cargo test --manifest-path core/Cargo.toml
      - name: Web server test (server)
        run: cargo test --manifest-path server/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Cargo clippy (shared engine)
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
  e2e:
    # macOS 15 required: the standard Playwright WebKit build (1.62+) needs
    # macOS 15+ — older runners can only run an older WebKit that rejects the
    # driver's PushAPIEnabled context setting.
    runs-on: macos-15
    timeout-minutes: 20
    needs: [test]
    # No approval gate: the browser matrix is a required PR check, so waiting on
    # a manual build-approval deployment stalls every PR for no artifact gain.
    # Only `build` (the DMGs) still asks for approval.
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Cache the Playwright browser builds (webkit/chromium ~1GB) — restored
      # on future runs so `playwright install` only fills gaps.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-
      # --no-install forces the LOCAL playwright (1.62.1) — without it npx can
      # resolve a pre-installed/global playwright on the runner and download a
      # mismatched webkit build (e.g. v2251 vs the v2336 our driver expects), which
      # then rejects the driver's PushAPIEnabled context setting at newPage.
      - name: Install Playwright browsers
        run: npx --no-install playwright install chromium webkit
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo (server target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-macos15-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos15-e2e-
      - name: Build web server (debug — used by the e2e harness)
        run: cargo build --manifest-path server/Cargo.toml
      - name: Build frontend
        run: npm run build
      - name: "E2E — all suites (smoke, AI transport, mentions)"
        # All three suites take about a minute. The step limit (not just the job's)
        # lets the log upload below still run when a suite hangs. It must outlast
        # the runner's own backstop for every suite (3 × 240 s + grace = ~12.5 min)
        # so run-all still prints its TIMEOUT summary when all of them hang.
        timeout-minutes: 15
        run: npm run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload e2e logs (server + browser console)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.browser }}
          path: test/artifacts/
          if-no-files-found: ignore

  test-server-linux:
    # Server-only on Linux: exercises cfg(target_os="linux") paths (delete →
    # .trash server-side trash) that never run on the macOS test job.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo (server target, Linux)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            server/target
          key: cargo-ubuntu-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-test-
      - name: Cargo test (web server, Linux)
        run: cargo test --manifest-path server/Cargo.toml
      - name: Cargo test (shared engine, Linux)
        run: cargo test --manifest-path core/Cargo.toml

  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit
          cd ../server && cargo audit
          cd ../core && cargo audit

  build:
    # Run on PRs too — build is a required branch-protection check, and this
    # catches dependency/compile breaks (e.g. a major bump) before merge.
    # Artifacts upload regardless; publish stays tag-only.
    #
    # NOT a plain `startsWith(github.ref, 'refs/tags/v')` check: release-please
    # tags the release commit via the API *after* that commit is already on
    # master, so GitHub emits no second run for the tag — the only run for the
    # release SHA carries `ref=refs/heads/master`, which failed the tag test and
    # silently skipped build → release-gate → publish (v0.2.0 shipped no DMGs
    # and no image). A master push IS the release commit, so accept it; publish
    # and release-gate are still hard-gated to real tags below.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [test]
    # PRs: heavy build waits for admin approval (build-approval env).
    # Tag push (release) / manual: runs automatically (release-auto env).
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-approval' || 'release-auto' }}
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    # The runner version is only the build host. The app's support floor is
    # bundle.macOS.minimumSystemVersion (macOS 12.3 = WKWebView Safari 15.4): rustc takes
    # the deployment target from MACOSX_DEPLOYMENT_TARGET or its per-target
    # default (11.0 arm64 / 10.12 x86_64), never from the runner SDK, so the
    # floor is pinned below and verified on the shipped binary to keep the
    # executable and the plist in agreement across toolchain changes.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # `target` (singular) is the input name: the old `targets` was ignored
      # with an "Unexpected input" warning. With rust-toolchain.toml present
      # the action runs `rustup target add` for the pinned toolchain — arm64
      # runners install only the native target, so this is what adds
      # x86_64-apple-darwin for the cross-compiled job.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Cache cargo (release targets, ${{ matrix.target }})
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Keyed on the runner image too: cargo does not fingerprint
          # MACOSX_DEPLOYMENT_TARGET (rust-lang/rust#118204), so a cache
          # restored from macos-14 builds would keep registry crates compiled
          # at rustc's old default floor until Cargo.lock changed.
          key: cargo-macos15-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos15-${{ matrix.target }}-
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      # Single source of truth: compile against the same floor the bundle
      # advertises (LSMinimumSystemVersion), not rustc's per-target default.
      - name: Pin macOS deployment target
        run: |
          MIN=$(node -p "require('./src-tauri/tauri.conf.json').bundle.macOS.minimumSystemVersion")
          echo "MACOSX_DEPLOYMENT_TARGET=$MIN" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$MIN"
      - name: Build Tauri (${{ matrix.arch }}, no bundle)
        run: npx tauri build --target ${{ matrix.target }} --no-bundle
      # macOS arm64 binaries are auto-signed `adhoc` by the linker. Apple
      # Silicon launchd REQUIRES a signature to spawn an arm64 process —
      # unsigned → RBSRequestErrorDomain Code=5 / POSIX 163 "Launch failed"
      # (no Open Anyway saves this; launch itself is rejected). So we KEEP
      # the adhoc signature on arm64 and strip only on x86_64.
      #
      # arm64 (adhoc-signed, kept):   download+quarantine shows "app is
      #   damaged" → user runs `xattr -cr "DocuBook Editor.app"` once, then launches.
      # x86_64 (stripped, unsigned):  shows "developer cannot be verified"
      #   → Open Anyway → launches. launchd tolerates unsigned x86_64.
      - name: Strip ad-hoc signature (x86_64 only — Gatekeeper "damaged" fix)
        if: matrix.arch == 'amd64'
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/docubook-desktop"
          if ! codesign -dv "$BIN" >/dev/null 2>&1; then
            echo "SKIP: $BIN is already unsigned"
          else
            codesign --remove-signature "$BIN"
            if codesign -dv "$BIN" >/dev/null 2>&1; then
              echo "::error::signature still present after strip: $BIN"
              exit 1
            fi
            echo "OK: signature removed — $BIN"
          fi
      - name: Verify arm64 keeps signature (launchd spawn gate)
        if: matrix.arch == 'arm64'
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/docubook-desktop"
          if ! codesign -dv "$BIN" >/dev/null 2>&1; then
            echo "::error::$BIN is unsigned — Apple Silicon launchd will refuse spawn (POSIX 163)"
            exit 1
          fi
          echo "OK: $BIN keeps adhoc signature — launchd can spawn"
      - name: Bundle DMG (${{ matrix.arch }})
        run: npx tauri bundle --target ${{ matrix.target }}
      - name: Verify final app bundle (${{ matrix.arch }})
        run: |
          APP=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::No app bundle found"; exit 1; }
          test -x "$APP/Contents/MacOS/docubook-desktop" || {
            echo "::error::Final app executable is missing or not executable: $APP"
            exit 1
          }
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            codesign -dv "$APP/Contents/MacOS/docubook-desktop" >/dev/null 2>&1 || {
              echo "::error::Final arm64 app executable is unsigned"
              exit 1
            }
          else
            if codesign -dv "$APP/Contents/MacOS/docubook-desktop" >/dev/null 2>&1; then
              echo "::error::Final x86_64 app executable still has a signature"
              exit 1
            fi
          fi
      - name: Verify macOS deployment target (${{ matrix.arch }})
        run: |
          APP=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          BIN="$APP/Contents/MacOS/docubook-desktop"
          MINOS=$(otool -l "$BIN" | awk '/cmd LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          [ -n "$MINOS" ] || { echo "::error::No LC_BUILD_VERSION minos in $BIN"; exit 1; }
          # Version compare without sort -V (BSD sort on the runner).
          above() { awk -v a="$1" -v b="$2" 'BEGIN{split(a,x,".");split(b,y,".");for(i=1;i<=3;i++){if(x[i]+0>y[i]+0)exit 0;if(x[i]+0<y[i]+0)exit 1}exit 1}'; }
          if above "$MINOS" "$MACOSX_DEPLOYMENT_TARGET"; then
            echo "::error::$BIN minos $MINOS is above the macOS $MACOSX_DEPLOYMENT_TARGET support floor"
            exit 1
          fi
          if [ "$PLIST" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist LSMinimumSystemVersion $PLIST != $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi
          echo "OK: minos $MINOS, LSMinimumSystemVersion $PLIST (floor $MACOSX_DEPLOYMENT_TARGET)"
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: DocuBook-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  release-gate:
    # Release-only. `needs: build` now runs on a master push too, so this must
    # decide "is a release" from the tag on the commit, not from the ref the run
    # started on — see .github/scripts/resolve-release-tag.sh for why.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref_type == 'branch')
    needs: [lint, test, e2e, test-server-linux, security, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Resolved ONCE here and consumed by publish, so both jobs share one answer
    # instead of each re-deriving "is a release" from github.ref. An empty tag
    # means "this run is not a release" — the normal case for a plain master
    # push, not an error.
    outputs:
      tag: ${{ steps.releasetag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release tag
        id: releasetag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Normally the tag exists long before this job; the wait only covers a
          # slow release-please run.
          RELEASE_TAG_WAIT_SECONDS: "300"
        run: ./.github/scripts/resolve-release-tag.sh >> "$GITHUB_OUTPUT"
      - name: All release checks passed
        if: steps.releasetag.outputs.tag != ''
        run: echo "All CI, security, platform, and artifact checks passed for ${{ steps.releasetag.outputs.tag }}"

  publish:
    needs: [release-gate]
    # Gate on the RESOLVED tag, not on the event/ref heuristic. The old
    # `(github.event_name == 'push' && github.ref_type == 'branch')` clause was
    # true for EVERY master push — release or not — so a plain master push ran
    # this job and then hard-failed in the resolve step below ("refusing to
    # publish"), painting master red for a non-release. Now a run with no tag on
    # its commit simply SKIPS, which is how release-gate and docker.yml already
    # behave. The release-please master push still publishes, because its commit
    # carries the tag release-please created via the API.
    if: >-
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.tag != ''
    # Tag-only release — publishes automatically (no approval gate).
    environment: release-auto
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The tag comes from release-gate's output, so this job cannot disagree
      # with the gate about whether the run is a release.
      - name: Resolve the release tag
        id: releasetag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=${{ needs.release-gate.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ needs.release-gate.outputs.tag }}"
      - uses: actions/download-artifact@v8
        with:
          pattern: DocuBook-*
          # Keep per-artifact folders (DocuBook-arm64/, DocuBook-amd64/) so the
          # release globs resolve — merge-multiple flattens and breaks them.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.releasetag.outputs.tag }}"
          # Contributors: the authors of the commits since the previous release
          # (a squash merge is authored by the PR's author). Best effort: no
          # previous release or a failed lookup leaves the section out rather
          # than blocking the publish.
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.draft | not) | .tag_name | select(. != \"$TAG\")][0] // empty" 2>/dev/null || true)
          : > /tmp/contributors.txt
          if [ -n "$PREV" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$TAG" --paginate \
              --jq '.commits[] | select(.author.type? != "Bot") | .author.login // empty' \
              > /tmp/contributors.txt 2>/dev/null || : > /tmp/contributors.txt
          fi
          echo "contributors since ${PREV:-none}: $(tr '\n' ' ' < /tmp/contributors.txt)"
          # The tag's changelog section, heading icons removed, plus Contributors.
          node .github/scripts/release-notes.mjs "$TAG" CHANGELOG.md /tmp/contributors.txt > /tmp/release-notes.md
          # Artifacts preserve their full relative path (upload-artifact v4), so
          # locate the DMGs recursively instead of assuming a flat layout. The
          # product name contains a SPACE ("DocuBook Editor_*.dmg") — a plain
          # unquoted $DMGS word-splits and gh gets a broken path.
          mapfile -t DMGS < <(find DocuBook-* -name '*.dmg' -type f)
          echo "release assets: ${DMGS[*]}"
          [ "${#DMGS[@]}" -eq 2 ] || {
            echo "::error::Expected exactly two DMG assets, found ${#DMGS[@]}"
            exit 1
          }
          sha256sum "${DMGS[@]}" > SHA256SUMS.txt
          # Arm64 ad-hoc-signed download triggers Gatekeeper "app is damaged".
          # Users clear it once before first launch.
          cat >> /tmp/release-notes.md <<'EOF'

          ---
          **Web (Docker):** self-host via the container image
          ([`ghcr.io/docubook/editor`](https://github.com/DocuBook/editor/pkgs/container/editor)):
          ```bash
          docker run -d --name docubook -p 8080:8080 -v docubook:/data ghcr.io/docubook/editor:$TAG
          ```

          ---
          **macOS (Apple Silicon — `*_aarch64.dmg`):** first run may show “app
          is damaged.” Clear the quarantine flag once:
          ```bash
          xattr -cr "/Applications/DocuBook Editor.app"
          ```
          **macOS (Intel — `*_x64.dmg`):** right-click the app → *Open* →
          *Open Anyway* on the Gatekeeper dialog.
          EOF
          RELEASE_FLAGS=(--title "$TAG" --notes-file /tmp/release-notes.md)
          case "$TAG" in
            *-*) RELEASE_FLAGS+=(--prerelease) ;;
          esac
          # release-please already created the release for this tag, so
          # `create` would fail with "release already exists". Upload onto the
          # existing release instead; fall back to create when it is absent
          # (a plain tag push that bypasses release-please).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${RELEASE_FLAGS[@]}"
            gh release upload "$TAG" "${DMGS[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "${DMGS[@]}" SHA256SUMS.txt "${RELEASE_FLAGS[@]}"
          fi
