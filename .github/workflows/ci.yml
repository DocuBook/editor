name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLORS: always
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Oxlint
        run: npx oxlint frontend/
      - name: TypeScript type check
        run: npx tsc -b
      - name: ACL guard (every Tauri command has an allow entry)
        run: node test/check-acl.mjs
      - name: Frontend tests
        run: npx vitest run
      - name: Check version consistency (manifests + locks + changelog section)
        run: |
          npm_v=$(node -p "require('./package.json').version")
          lock_v=$(node -p "require('./package-lock.json').version")
          cargo_v=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          server_v=$(grep '^version' server/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          desktop_lock_v=$(grep -A1 'name = "docubook-desktop"' src-tauri/Cargo.lock | grep '^version' | head -1 | awk '{print $3}' | tr -d '"')
          server_lock_v=$(grep -A1 'name = "docubook-server"' server/Cargo.lock | grep '^version' | head -1 | awk '{print $3}' | tr -d '"')
          echo "package.json=$npm_v package-lock=$lock_v Cargo.toml=$cargo_v server=$server_v tauri.conf.json=$tauri_v Cargo.lock(desktop)=$desktop_lock_v Cargo.lock(server)=$server_lock_v"
          for v in "$lock_v" "$cargo_v" "$server_v" "$tauri_v" "$desktop_lock_v" "$server_lock_v"; do
            [ "$npm_v" = "$v" ] || { echo "::error::Version mismatch — bump manifests together (pre-push hook syncs *.lock)"; exit 1; }
          done
          grep -q "^## v$npm_v — " CHANGELOG.md || { echo "::error::CHANGELOG.md missing section '## v$npm_v —'"; exit 1; }

  test:
    runs-on: macos-14
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache cargo (registry + targets)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            server/target
          key: cargo-macos14-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos14-test-
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Web server test (server)
        run: cargo test --manifest-path server/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
  e2e:
    # macOS 15 required: the standard Playwright WebKit build (1.62+) needs
    # macOS 15+ — older runners can only run an older WebKit that rejects the
    # driver's PushAPIEnabled context setting.
    runs-on: macos-15
    needs: [test]
    # Heavy matrix job: PRs wait for the same approval gate as the build job;
    # push to master / tags / manual run without approval (behavior unchanged).
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-approval' || 'release-auto' }}
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Cache the Playwright browser builds (webkit/chromium ~1GB) — restored
      # on future runs so `playwright install` only fills gaps.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-
      # --no-install forces the LOCAL playwright (1.62.1) — without it npx can
      # resolve a pre-installed/global playwright on the runner and download a
      # mismatched webkit build (e.g. v2251 vs the v2336 our driver expects), which
      # then rejects the driver's PushAPIEnabled context setting at newPage.
      - name: Install Playwright browsers
        run: npx --no-install playwright install chromium webkit
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache cargo (server target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-macos15-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos15-e2e-
      - name: Build web server (debug — used by the e2e harness)
        run: cargo build --manifest-path server/Cargo.toml
      - name: Build frontend
        run: npm run build
      - name: "E2E — all suites (web-smoke, trash, theme, AI transport)"
        run: npm run test:e2e
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload e2e logs (server + browser console)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.browser }}
          path: test/artifacts/
          if-no-files-found: ignore

  test-server-linux:
    # Server-only on Linux: exercises cfg(target_os="linux") paths (delete →
    # .trash server-side trash) that never run on the macos-14 test job.
    runs-on: ubuntu-22.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache cargo (server target, Linux)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-ubuntu-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-test-
      - name: Cargo test (web server, Linux)
        run: cargo test --manifest-path server/Cargo.toml

  security:
    runs-on: ubuntu-22.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit
          cd ../server && cargo audit


  build:
    # Run on PRs too — build is a required branch-protection check, and this
    # catches dependency/compile breaks (e.g. a major bump) before merge.
    # Artifacts upload regardless; publish stays tag-only.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    # PRs: heavy build waits for admin approval (build-approval env).
    # Tag push (release) / manual: runs automatically (release-auto env).
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-approval' || 'release-auto' }}
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo (release targets, ${{ matrix.target }})
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-
      # arm64 runners (macos-14) install only the native target by default —
      # ensure the matrix target is present for the x86_64 job.
      - name: Ensure target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri (${{ matrix.arch }}, no bundle)
        run: npx tauri build --target ${{ matrix.target }} --no-bundle
      # macOS arm64 binaries are auto-signed `adhoc` by the linker. Apple
      # Silicon launchd REQUIRES a signature to spawn an arm64 process —
      # unsigned → RBSRequestErrorDomain Code=5 / POSIX 163 "Launch failed"
      # (no Open Anyway saves this; launch itself is rejected). So we KEEP
      # the adhoc signature on arm64 and strip only on x86_64.
      #
      # arm64 (adhoc-signed, kept):   download+quarantine shows "app is
      #   damaged" → user runs `xattr -cr "DocuBook Editor.app"` once, then launches.
      # x86_64 (stripped, unsigned):  shows "developer cannot be verified"
      #   → Open Anyway → launches. launchd tolerates unsigned x86_64.
      - name: Strip ad-hoc signature (x86_64 only — Gatekeeper "damaged" fix)
        if: matrix.arch == 'amd64'
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/docubook-desktop"
          if ! codesign -dv "$BIN" >/dev/null 2>&1; then
            echo "SKIP: $BIN is already unsigned"
          else
            codesign --remove-signature "$BIN"
            if codesign -dv "$BIN" >/dev/null 2>&1; then
              echo "::error::signature still present after strip: $BIN"
              exit 1
            fi
            echo "OK: signature removed — $BIN"
          fi
      - name: Verify arm64 keeps signature (launchd spawn gate)
        if: matrix.arch == 'arm64'
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/docubook-desktop"
          if ! codesign -dv "$BIN" >/dev/null 2>&1; then
            echo "::error::$BIN is unsigned — Apple Silicon launchd will refuse spawn (POSIX 163)"
            exit 1
          fi
          echo "OK: $BIN keeps adhoc signature — launchd can spawn"
      - name: Bundle DMG (${{ matrix.arch }})
        run: npx tauri bundle --target ${{ matrix.target }}
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: DocuBook-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    # Tag-only — release publishes automatically (no approval gate).
    environment: release-auto
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: DocuBook-*
          # Keep per-artifact folders (DocuBook-arm64/, DocuBook-amd64/) so the
          # release globs resolve — merge-multiple flattens and breaks them.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Extract changelog section matching the tag version
          awk -v tag="$TAG" '
            BEGIN { flag=0 }
            index($0, "## "tag) == 1 && flag==0 { flag=1; next }
            /^## / && flag==1 { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # Artifacts preserve their full relative path (upload-artifact v4), so
          # locate the DMGs recursively instead of assuming a flat layout. The
          # product name contains a SPACE ("DocuBook Editor_*.dmg") — a plain
          # unquoted $DMGS word-splits and gh gets a broken path.
          mapfile -t DMGS < <(find DocuBook-* -name '*.dmg')
          echo "release assets: ${DMGS[*]}"
          # Arm64 ad-hoc-signed download triggers Gatekeeper "app is damaged".
          # Users clear it once before first launch.
          cat >> /tmp/release-notes.md <<'EOF'

          ---
          **Web (Docker):** self-host via the container image
          ([`ghcr.io/docubook/editor`](https://github.com/DocuBook/editor/pkgs/container/editor)):
          ```bash
          docker run -d --name docubook -p 8080:8080 -v docubook:/data ghcr.io/docubook/editor:${{ github.ref_name }}
          ```

          ---
          **macOS (Apple Silicon — `*_aarch64.dmg`):** first run may show “app
          is damaged.” Clear the quarantine flag once:
          ```bash
          xattr -cr "/Applications/DocuBook Editor.app"
          ```
          **macOS (Intel — `*_x64.dmg`):** right-click the app → *Open* →
          *Open Anyway* on the Gatekeeper dialog.
          EOF
          gh release create "$TAG" "${DMGS[@]}" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
