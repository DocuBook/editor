name: CI

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLORS: always
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Oxlint
        run: npx oxlint src/
      - name: TypeScript type check
        run: npx tsc -b
      - name: Frontend tests
        run: npx vitest run
      - name: Check version consistency (package.json / Cargo.toml / tauri.conf.json)
        run: |
          npm_v=$(node -p "require('./package.json').version")
          cargo_v=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          tauri_v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "package.json=$npm_v Cargo.toml=$cargo_v tauri.conf.json=$tauri_v"
          if [ "$npm_v" != "$cargo_v" ] || [ "$npm_v" != "$tauri_v" ]; then
            echo "::error::Version mismatch — bump all three together"
            exit 1
          fi

  test:
    runs-on: macos-14
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
  security:
    runs-on: ubuntu-22.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit


  build:
    # Run on PRs too — build is a required branch-protection check, and this
    # catches dependency/compile breaks (e.g. a major bump) before merge.
    # Artifacts upload regardless; publish stays tag-only.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}
      # arm64 runners (macos-14) install only the native target by default —
      # ensure the matrix target is present for the x86_64 job.
      - name: Ensure target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri (${{ matrix.arch }})
        run: npx tauri build --target ${{ matrix.target }}
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: DocuBook-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: DocuBook-*
          # Keep per-artifact folders (DocuBook-arm64/, DocuBook-amd64/) so the
          # release globs resolve — merge-multiple flattens and breaks them.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Extract changelog section matching the tag version
          awk -v tag="$TAG" '
            BEGIN { flag=0 }
            index($0, "## "tag) == 1 && flag==0 { flag=1; next }
            /^## / && flag==1 { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # Artifacts preserve their full relative path (upload-artifact v4), so
          # locate the DMGs recursively instead of assuming a flat layout.
          DMGS=$(find DocuBook-* -name '*.dmg')
          echo "release assets: $DMGS"
          gh release create "$TAG" $DMGS \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
