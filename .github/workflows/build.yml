name: Build Editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            goarch: amd64
            label: intel
            runner: macos-13
            output: editor-darwin-amd64
          - arch: arm64
            goarch: arm64
            label: apple-silicon
            runner: macos-14
            output: editor-darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build preview bundle + frontend
        run: cd frontend && npm run build

      - name: Build Wails app (${{ matrix.label }})
        run: wails build -skipbindings -platform darwin/${{ matrix.goarch }}

      - name: Package DMG
        run: |
          mkdir -p dist
          cp -r build/bin/editor.app dist/
          hdiutil create -volname Editor -srcfolder dist/editor.app \
            -ov -format UDZO dist/${{ matrix.output }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}.dmg
