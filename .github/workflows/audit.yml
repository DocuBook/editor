name: Scheduled audit

# ci.yml's `security` job only runs on a push or PR, so a new advisory against
# unchanged dependencies would go unnoticed. Kept separate from ci.yml because
# `security` is a required check (a reusable workflow would rename it) and a
# schedule there would also run the macOS jobs. Keep the steps in step with it.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  NODE_VERSION: "22.23.4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm audit reads package-lock.json; no install needed.
      - name: npm audit (fail on high)
        run: npm audit --audit-level=high
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit
          cd ../server && cargo audit
          cd ../core && cargo audit
