[package]
name = "docubook-core"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

# Pure-Rust engine shared by both runtimes: the desktop app (src-tauri) and the
# web server (server). Holds the filesystem/git/markdown/AI modules that used to
# live in src-tauri and were pulled into the server through `#[path]` includes.
# Deliberately free of Tauri and axum so either runtime can depend on it.

[lib]
name = "docubook_core"
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
pulldown-cmark = "0.13"
ammonia = "4"
regex = "1"
tracing = "0.1"
trash = "5"
# Vendored OpenSSL/libgit2 so the crate builds identically on the musl image and
# on the desktop toolchains the consumers use.
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
# No TLS backend here: the consuming binary picks one (native-tls on desktop,
# rustls on the musl server) and Cargo unifies the features within its graph.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
eventsource-stream = "0.2.3"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
