# DocuBook editor — web (Docker) distribution
services:
  docubook:
    build: .
    # Unpinned: resolves to ghcr.io/docubook/editor:latest, the same reference
    # CI publishes, so `compose pull` and `docker run ghcr.io/docubook/editor`
    # agree. `compose build` still tags the local build with this name.
    # Pin a release yourself by editing the tag (e.g. ghcr.io/docubook/editor:0.1.0).
    image: ghcr.io/docubook/editor
    ports:
      - "8080:8080"
    volumes:
      # Named volume: portable across every Docker host, seeded with the image's
      # /data ownership (uid 1000) on first use. This is the recommended setup.
      # To bind a host directory instead, pre-create a DEDICATED directory owned
      # by 1000:1000 and bind that — never a shared parent (/data, $HOME,
      # /var/www, ...); the entrypoint must not chown host files it doesn't own.
      - docubook:/data   # vaults + api keys + config.json (all 0600)
    environment:
      # ── Server (boot-time) ──
      PORT: 8080                 # HTTP port; keep 8080 when behind the Coolify/Traefik proxy
      DATA_DIR: /data            # vaults/, keys.json, config.json — mount the volume here
      WWW_DIR: /app/www          # built frontend (read-only)
      # ── First-boot provisioning (headless admin) ──
      # Set BOTH to auto-create the admin and skip the setup wizard.
      # DB_ADMIN_EMAIL: admin@example.com
      # DB_ADMIN_PASSWORD: change-me-123
      # ── Login / sessions (env wins over Settings → System) ──
      # DB_SETUP_TOKEN: ""           # optional plain secret (NOT a JWT) guarding
      #                               # first-run admin creation; wizard asks for
      #                               # it when set (openssl rand -hex 32)
      DB_SESSION_TTL_HOURS: "168"  # session lifetime in hours (1–8760)
      DB_SECURE_COOKIE: "0"      # "1" when HTTPS (Coolify TLS proxy) — Secure flag on session cookie
      # ── Custom OpenAI-compatible provider (optional env override) ──
      # Provision/override the "openai-compatible" custom provider from env;
      # when BASE_URL is set the UI shows it READ-ONLY ("from env" badge).
      # DB_OPENAI_COMPAT_BASE_URL: https://proxy.example.com/v1
      # DB_OPENAI_COMPAT_API_KEY: sk-...
      # DB_OPENAI_COMPAT_MODEL: gpt-oss-20b
    restart: unless-stopped

volumes:
  # Fixed physical name, so the volume survives renames of the checkout
  # directory (Compose would otherwise use `<project>_docubook`).
  docubook:
    name: docubook
