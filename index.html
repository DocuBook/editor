<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/appicon.png" />
        <!-- `interactive-widget=resizes-content` (Chromium 108+ / Android): the soft
             keyboard resizes the layout viewport, so the shell and every `dvh` anchor
             in it shrink with the keyboard instead of leaving the composer behind it.
             Engines that do not know the key ignore it functionally; WebKit reports
             it as an error-level console warning, allowlisted by the e2e harness. The default is
             `resizes-visual`, which resizes only the visual viewport. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
        <meta name="theme-color" content="#0c0c0d" />
        <title>DocuBook Editor</title>
        <!-- Cold-open guard — the authoritative copy of this root cause.

             The editable source of a source-backed block is a ProseMirror
             contentDOM that React appends TWICE on a cold mount: first as a
             DIRECT CHILD of the block's node view renderer (while the popup or
             `pre > code` wrapper does not exist yet), then re-parented into it.
             Nothing hides the first append, so the raw source paints for a frame
             — the flash. BlockNote's own hiding rule cannot win that race: it
             lives in the LAZY WysiwygEditorHost stylesheet, which lands after
             the append. This copy is inlined in the document head, so it is
             parsed before any script runs and applied before the first editor
             frame, independent of chunk order.

             The direct-child rule is UNCONDITIONAL: every source-backed node
             view — code block included — appends its raw source this way, so
             excluding any of them would let its source paint. It can only match
             while the contentDOM is un-parented, which is exactly that window;
             after settle the code block's contentDOM lives inside `pre > code`.
             `frontend/index.css` mirrors it for stylesheet-only entry points. -->
        <style>
            /* Closed popup: never paint its source, whatever the late BlockNote
               rule says about its colour. */
            .bn-preview-with-source-popup:not([data-open='true']) .bn-source-block-popup {
                visibility: hidden;
            }
            /* The un-parented contentDOM window (see the comment above). */
            .bn-react-node-view-renderer > [data-node-view-content-react] {
                visibility: hidden;
            }
            /* The preview shares the source-popup subtree. Do not let the
               closed popup's inherited visibility hide rendered SVG or math. */
            .bn-preview-container {
                visibility: visible;
            }
            /* An open popup's source stays editable and visible. */
            .bn-preview-with-source-popup[data-open='true'] .bn-source-block-popup {
                visibility: visible;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/frontend/main.tsx"></script>
    </body>
</html>
